<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question for You ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe4ef, #ffc3d9, #fff0f5);
  color: #86104e;
  overflow-x: hidden;
}

.heart {
  position: fixed;
  bottom: -35px;
  color: #ec4899;
  opacity: .35;
  pointer-events: none;
  animation: floatUp 9s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(0) rotate(0); }
  to { transform: translateY(-115vh) rotate(35deg); }
}

.card {
  position: relative;
  width: 100%;
  max-width: 430px;
  padding: 34px 24px;
  text-align: center;
  background: rgba(255,255,255,.88);
  border: 1px solid white;
  border-radius: 26px;
  box-shadow: 0 15px 50px #be185d20;
}

.big-heart { font-size: 54px; }

h1 {
  font-size: 27px;
  line-height: 1.3;
  margin: 12px 0;
}

p {
  line-height: 1.6;
  color: #9d174d;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

button {
  flex: 1;
  padding: 15px 12px;
  border: 0;
  border-radius: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.yes {
  background: #db2777;
  color: white;
}

.no {
  background: #fce7f3;
  color: #9d174d;
}

button:focus-visible {
  outline: 3px solid #86104e;
  outline-offset: 3px;
}

#message {
  min-height: 28px;
  margin-top: 20px;
  font-weight: bold;
}

.small {
  font-size: 12px;
  opacity: .8;
  margin-top: 22px;
}
</style>
</head>
<body>

<div class="card">
  <div class="big-heart" aria-hidden="true">💗</div>
  <p id="step">A LITTLE QUESTION FOR YOU</p>
  <h1 id="question">I like you. Will you date me?</h1>
  <p id="description">There is something I've been wanting to ask you.</p>

  <div class="buttons" id="buttons">
    <button class="yes" onclick="choose('Yes')">Yes ❤️</button>
    <button class="no" onclick="choose('No')">No</button>
  </div>

  <div id="message" role="status" aria-live="polite"></div>
  <p class="small">Made with care and a little courage.</p>
</div>

<script>
/*
  EMAILJS SETUP:
  Replace these three values after creating your EmailJS account.
*/
const EMAILJS_PUBLIC_KEY = "YOUR_PUBLIC_KEY";
const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";

let stage = 1;
let notificationQueue = Promise.resolve();

async function notifyOwner(stageName, answer, outcome) {
  if (
    EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY" ||
    EMAILJS_SERVICE_ID === "YOUR_SERVICE_ID" ||
    EMAILJS_TEMPLATE_ID === "YOUR_TEMPLATE_ID"
  ) {
    console.warn("EmailJS has not been configured yet.");
    return;
  }

  // Load the official EmailJS browser SDK only when configured.
  if (!window.emailjs) {
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src =
        "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
      script.onload = resolve;
      script.onerror = () => reject(new Error("Could not load EmailJS."));
      document.head.appendChild(script);
    });
    window.emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
  }

  return window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    stage: stageName,
    answer: answer,
    outcome: outcome,
    submitted_at: new Date().toLocaleString()
  });
}

function choose(answer) {
  const buttons = document.getElementById("buttons");
  const question = document.getElementById("question");
  const description = document.getElementById("description");
  const message = document.getElementById("message");
  const step = document.getElementById("step");

  buttons.querySelectorAll("button").forEach(button => {
    button.disabled = true;
  });

  const currentStage = stage;

  let outcome = "";
  if (currentStage === 1) {
    outcome = answer === "Yes"
      ? "Chose Yes to dating question"
      : "Chose No to dating question";
  } else {
    outcome = answer === "Yes"
      ? "I also like you!"
      : "Then let's be friends.";
  }

  // Queue notifications so both answers are reported in order.
  notificationQueue = notificationQueue
    .then(() => notifyOwner(
      currentStage === 1 ? "Dating question" : "Do you really like me?",
      answer,
      outcome
    ))
    .catch(error => {
      console.error("Email notification failed:", error);
    });

  if (currentStage === 1 && answer === "Yes") {
    stage = 2;
    step.textContent = "ONE MORE THING...";
    question.textContent = "Do you really like me?";
    description.textContent = "Be honest with me.";
    buttons.innerHTML = `
      <button class="yes" onclick="choose('Yes')">Yes ❤️</button>
      <button class="no" onclick="choose('No')">No</button>
    `;
    message.textContent = "";
    return;
  }

  buttons.style.display = "none";
  document.querySelector(".big-heart").textContent =
    currentStage === 2 && answer === "Yes" ? "💖" : "💕";

  question.textContent = currentStage === 2
    ? outcome
    : "Thank you for answering.";

  description.textContent = currentStage === 1
    ? "Thank you for being honest with me."
    : "Thank you for telling me how you feel.";

  step.textContent = "YOUR ANSWER";
  message.textContent = "Your answer has been recorded on this page.";
}

// Decorative floating hearts
for (let i = 0; i < 12; i++) {
  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = "♥️";
  heart.style.left = Math.random() * 100 + "%";
  heart.style.animationDelay = Math.random() * 9 + "s";
  heart.style.animationDuration = (7 + Math.random() * 7) + "s";
  heart.style.fontSize = (14 + Math.random() * 24) + "px";
  document.body.appendChild(heart);
}
</script>
</body>
</html>
